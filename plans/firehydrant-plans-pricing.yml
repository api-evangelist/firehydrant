description: >-
  FireHydrant's published plans, read verbatim from firehydrant.com/pricing on 2026-08-29. Pricing
  is per RESPONDER per month, not per API call — there is no API-metered plan, no published request
  quota per tier, and the account API rate limit (50 req/10s) is flat across every tier. This
  artifact replaces the 2026-05-04 scaffold, whose per-tier request quotas and overage prices were
  invented.
plan_count: 3
currency: USD
billing_note: >-
  Pro price shown is the annual-billing rate. A 14-day free trial of Pro is offered with no credit
  card. Signals on-call/alerting is charged separately, based on the number of alerts sent. SMS and
  voice notifications are available for purchase on Pro.
