faq:
- q: How does the free trial work?
  a: 14-day free trial of the Pro plan, no credit card required, full feature access.
- q: What payment methods do you accept?
  a: All major credit cards; purchase orders can be accommodated for Enterprise plans.
- q: How do you charge for alerting and on-call (Signals)?
  a: Signals is charged based on the number of alerts you send.
