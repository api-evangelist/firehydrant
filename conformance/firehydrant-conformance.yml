- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme anywhere in the 373-operation spec. Authentication is a single apiKey
    scheme sending an organization API key as `Authorization: Bearer fhb-...`. There is no OAuth
    authorization-code flow, no scopes, and therefore no delegated third-party access model.
- id: oidc
  conforms: false
  evidence: No openIdConnect securityScheme; no /.well-known/openid-configuration served on any host.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    No application/problem+json anywhere in the spec. Errors use a vendor ErrorEntity
    (code/detail/messages/meta) in the spec and a flat single-key error object at runtime.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header support documented; zero operations carry deprecated:true.
- id: idempotency-key
  conforms: false
  evidence: No Idempotency-Key header or parameter in the spec or the API reference.
- id: json-api
  conforms: false
  evidence: >-
    Responses use a vendor envelope — a `data` array plus a `pagination` object with
    count/page/items/pages/last/prev/next — not JSON:API.
- id: pagination
  conforms: true
  evidence: >-
    Page-number pagination documented and implemented consistently — `page` and `per_page` query
    params on 51 and 52 operations respectively, per_page default 20 and max 200, with a
    `pagination` metadata object on every list response.
- id: webhook-hmac-signing
  conforms: true
  evidence: >-
    Webhooks are signed with an HMAC-SHA256 hex digest of the raw body under a shared secret,
    presented in the `fh-signature` header — https://docs.firehydrant.com/docs/webhooks.
