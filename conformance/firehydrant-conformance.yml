standards:
- id: scim2
  name: SCIM 2.0 (RFC 7643 / RFC 7644)
  conforms: true
  domain_standard: true
  evidence: >-
    The contract itself declares SCIM, not just a marketing page. openapi/firehydrant-api-openapi.yml
    exposes /v1/scim/v2/Users and /v1/scim/v2/Groups (GET, POST) plus /v1/scim/v2/Users/{id} and
    /v1/scim/v2/Groups/{id} (PUT, PATCH), the request bodies use the `application/scim+json` media
    type, and the User PATCH body is the RFC 7644 Operations[] array with op (add/remove/replace)
    and path. Groups are explicitly documented as "Colloquial for Group in the SCIM protocol",
    mapped to FireHydrant Teams. SCIM is also named as an Enterprise-plan feature on
    firehydrant.com/pricing and on firehydrant.com/security.
  operations:
  - getScimUsers
  - createScimUser
  - getScimGroups
  - createScimGroup
  spec_location: openapi/firehydrant-api-openapi.yml paths /v1/scim/v2/*
  deviation: >-
    No `schemas` array carrying urn:ietf:params:scim:schemas:* appears in the request/response
    models in the published spec, and no /ServiceProviderConfig, /Schemas or /ResourceTypes
    discovery endpoints are exposed. A SCIM client that negotiates capability before provisioning
    will find nothing to read.
- id: saml2
  name: SAML 2.0
  conforms: true
  evidence: >-
    "SAML 2.0 and SCIM Support — Leverage your identity provider's existing access controls and
    lifecycle management tools" on https://firehydrant.com/security/. Not an API-surface standard;
    recorded because it pairs with the SCIM provisioning surface.
- id: soc2-type2
  name: SOC 2 Type II
  conforms: true
  evidence: >-
    "FireHydrant is SOC 2 Type II compliant... have achieved Type II compliance as of September
    2021" — https://firehydrant.com/security/. Report available on request. Also listed on the
    Freshworks trust center (trust.freshworks.com/?product=firehydrant).
- id: iso27001
  name: ISO/IEC 27001
  conforms: true
  evidence: Listed on https://trust.freshworks.com/?product=firehydrant (FireHydrant is a Freshworks company).
- id: csa-star
  name: CSA STAR
  conforms: true
  evidence: Listed on https://trust.freshworks.com/?product=firehydrant.
- id: gdpr-data-residency
  name: EU data residency
  conforms: true
  evidence: >-
    "April Recap: EU Instance" — https://firehydrant.com/changelog/ (2026-05-13). FireHydrant runs a
