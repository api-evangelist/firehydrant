rfc9457: false
note: >-
  FireHydrant does not use RFC 9457 problem+json. It has TWO error shapes and an agent has to
  handle both. The OpenAPI declares a structured ErrorEntity (code/detail/messages/meta) on the
  documented 4xx responses, but the errors an unauthenticated or throttled caller actually
  receives — verified live — are a flat {"error": "<message>"} envelope that appears nowhere in
  the spec. The spec's error coverage is also thin: of 373 operations, only 12 declare a 400 and
  2 declare a 409. No operation declares 401, 403, 404, 422, 429 or any 5xx, even though the
  reference documents 429 explicitly and 401 was observed live.
