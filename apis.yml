aid: firehydrant
name: FireHydrant
description: >-
  FireHydrant is an incident management platform, now part of Freshworks, that covers the whole
  incident lifecycle — declaring and driving incidents from Slack or Microsoft Teams, Signals
  on-call scheduling and alerting, automated runbooks, a service catalog with environments and
  functionalities, its own hosted status pages, AI-enriched incident summaries, and retrospectives
  with analytics. Its REST API at api.firehydrant.io/v1 is a 373-operation, 228-path surface
  covering incidents, alerts, teams, runbooks, changes, integrations, webhooks and SCIM 2.0
  provisioning, authenticated with a single organization API key sent as a Bearer token. FireHydrant
  also ships an official MCP server, first-party TypeScript and Go SDKs, a Terraform provider, and
  the fhcli change-event CLI.
